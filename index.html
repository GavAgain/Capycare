<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffb82e">
  <meta name="description" content="Capycare — a friendly concept for talking, learning, and finding support.">
  <title>Capycare.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #ffb72f;
      --sun-light: #ffc64e;
      --cream: #fff4d6;
      --ink: #563014;
      --ink-deep: #3f2412;
      --purple: #7770d9;
      --shadow: #ca7b1e;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink-deep);
      background: var(--sun);
      background-image: radial-gradient(ellipse at 50% 34%, rgba(255, 219, 114, .55), transparent 55%);
      font-family: 'Nunito', system-ui, sans-serif;
    }
    button { font: inherit; }


    .lock { font-size: 14px; }
    .star { font-size: 18px; margin-left: auto; }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 62px 26px 36px;
    }
    .hero { text-align: center; }
    .brand-lockup {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 34px;
      padding-top: 35px;
    }
    h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--cream);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: clamp(2rem, 6.8vw, 5.25rem);
      line-height: 1.28;
      letter-spacing: -0.07em;
      text-shadow:
        4px 0 var(--ink), -4px 0 var(--ink), 0 4px var(--ink), 0 -4px var(--ink),
        4px 4px var(--ink), -4px 4px var(--ink), 4px -4px var(--ink), -4px -4px var(--ink),
        7px 8px 0 #98551d;
      white-space: nowrap;
    }
    .mascot {
      position: absolute;
      z-index: 3;
      width: clamp(120px, 18vw, 205px);
      right: 7%;
      top: -35px;
      transform: rotate(5deg);
      filter: drop-shadow(4px 5px 0 rgba(88, 48, 20, .12));
      pointer-events: none;
    }
    .tagline {
      margin: 0 auto;
      max-width: 560px;
      color: #70421d;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 800;
      letter-spacing: .02em;
    }
    .tiny-stars { margin-top: 13px; color: #fff5cf; font-size: 20px; letter-spacing: 13px; text-shadow: 1px 2px #cc7e24; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      max-width: 990px;
      margin: 42px auto 0;
    }
    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 190px;
      padding: 24px 15px;
      border: 4px solid var(--ink);
      border-radius: 16px;
      background: var(--cream);
      color: var(--ink);
      box-shadow: 0 8px 0 var(--shadow), 0 12px 15px rgba(103, 57, 17, .11);
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .choice:hover, .choice:focus-visible {
      transform: translateY(-5px);
      background: #fff9e9;
      box-shadow: 0 13px 0 var(--shadow), 0 17px 18px rgba(103, 57, 17, .13);
      outline: none;
    }
    .choice:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--shadow); }
    .choice-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 56px;
      color: var(--ink);
    }
    .choice-icon svg { width: 58px; height: 54px; overflow: visible; }
    .choice-label {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: clamp(.63rem, 1.3vw, .88rem);
      line-height: 1.8;
      text-align: center;
    }
    .footer-note {
      margin: 46px auto 0;
      text-align: center;
      color: #70421d;
      font-weight: 900;
      font-size: .96rem;
    }
    .footer-note span { color: #fff4d6; text-shadow: 1px 1px #b36d1e; }

    dialog {
      width: min(92vw, 470px);
      padding: 0;
      border: 4px solid var(--ink);
      border-radius: 18px;
      background: var(--cream);
      color: var(--ink-deep);
      box-shadow: 0 12px 0 rgba(77, 41, 15, .22);
    }
    dialog::backdrop { background: rgba(65, 36, 16, .42); backdrop-filter: blur(3px); }
    .modal-content { padding: 27px; }
    .modal-content h2 {
      margin: 0 0 15px;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 1rem;
      line-height: 1.8;
    }
    .modal-content p { font-size: 1.02rem; line-height: 1.6; margin: 0 0 19px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .close-button {
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 10px 17px;
      background: var(--sun-light);
      color: var(--ink-deep);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .close-button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
    .small-note { margin-top: 18px; font-size: .78rem; line-height: 1.5; color: #80552c; }

    @media (max-width: 720px) {
      .browser-bar { gap: 9px; min-height: 54px; padding: 8px 10px; }
      .dot { width: 12px; height: 12px; }
      .browser-arrow { display: none; }
      .address-pill { height: 36px; padding: 0 11px; font-size: 12px; }
      main { padding: 50px 17px 28px; }
      .brand-lockup { margin-bottom: 22px; padding-top: 42px; }
      .mascot { width: 118px; right: 3%; top: -29px; }
      h1 { font-size: clamp(1.7rem, 8.5vw, 3.4rem); letter-spacing: -.08em; }
      .choices { grid-template-columns: 1fr; max-width: 410px; gap: 17px; margin-top: 30px; }
      .choice { min-height: 125px; flex-direction: row; justify-content: flex-start; gap: 17px; padding: 20px 26px; }
      .choice-icon { flex: 0 0 60px; }
      .choice-label { font-size: .72rem; text-align: left; }
      .footer-note { margin-top: 35px; font-size: .86rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="brandTitle">
      <div class="brand-lockup">
        <h1 id="brandTitle">Capycare.</h1>
        <!-- Small, blocky capybara wizard mascot drawn directly as SVG. -->
        
<svg class="mascot" viewBox="0 0 180 128" role="img" aria-label="Cute pixel-art capybara wizard" shape-rendering="crispEdges">
  <!-- Wizard hat -->
  <g stroke="#563014" stroke-width="3" stroke-linejoin="round">
    <path d="M57 48 L65 31 L78 35 L91 9 L104 15 L120 37 L134 42 L133 49 Z"
          fill="#7770d9"/>
    <path d="M50 46 L135 46 L143 54 L44 54 Z" fill="#5750b5"/>
    <rect x="89" y="25" width="6" height="6" fill="#fff0a7" stroke="none"/>
    <rect x="106" y="35" width="5" height="5" fill="#fff0a7" stroke="none"/>
  </g>

  <!-- Body -->
  <path d="M45 77 L54 65 L73 61 L113 64 L129 77 L132 96
           L120 96 L120 108 L105 108 L105 98 L78 98
           L78 108 L63 108 L63 98 L48 98 L40 89 Z"
        fill="#b97b45" stroke="#563014" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Head and chunky capybara snout -->
  <path d="M43 59 L49 48 L66 45 L82 51 L88 61
           L101 61 L111 67 L111 76 L100 80
           L81 80 L72 75 L53 75 L43 68 Z"
        fill="#d49a60" stroke="#563014" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Little ear -->
  <rect x="52" y="42" width="11" height="10" fill="#b97b45"
        stroke="#563014" stroke-width="3"/>
  <rect x="56" y="45" width="4" height="4" fill="#efb7a0"/>

  <!-- Snout and nose -->
  <rect x="91" y="64" width="15" height="10" fill="#e2ad78"/>
  <rect x="102" y="63" width="8" height="6" fill="#563014"/>
  <rect x="96" y="75" width="5" height="3" fill="#87502c"/>

  <!-- Eye and rosy cheek -->
  <rect x="76" y="57" width="5" height="6" fill="#3f2412"/>
  <rect x="83" y="67" width="8" height="4" fill="#e99b91"/>

  <!-- Tiny feet -->
  <rect x="44" y="94" width="19" height="9" fill="#87502c"
        stroke="#563014" stroke-width="3"/>
  <rect x="102" y="94" width="19" height="9" fill="#87502c"
        stroke="#563014" stroke-width="3"/>

  <!-- Little magic wand -->
  <path d="M137 81 L151 65" stroke="#69451e" stroke-width="5"/>
  <path d="M150 55 L154 62 L161 65 L154 69 L150 76
           L146 69 L139 65 L146 62 Z"
        fill="#fff0a7" stroke="#563014" stroke-width="2"/>
</svg>

        </span>
        <span class="choice-label">Anonymous Chat</span>
      </button>

      <button class="choice" type="button" data-feature="ai">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 64 58" fill="none">
            <path d="M32 3 V11" stroke="#563014" stroke-width="4" stroke-linecap="square"/>
            <circle cx="32" cy="5" r="4" fill="#ffcf58" stroke="#563014" stroke-width="3"/>
            <rect x="9" y="12" width="46" height="35" rx="7" fill="#a8d9fb" stroke="#563014" stroke-width="4"/>
            <rect x="19" y="23" width="6" height="7" fill="#563014"/><rect x="39" y="23" width="6" height="7" fill="#563014"/>
            <path d="M23 36 Q32 43 41 36" stroke="#563014" stroke-width="4" stroke-linecap="square"/>
            <rect x="3" y="23" width="6" height="14" fill="#7770d9" stroke="#563014" stroke-width="3"/>
            <rect x="55" y="23" width="6" height="14" fill="#7770d9" stroke="#563014" stroke-width="3"/>
          </svg>
        </span>
        <span class="choice-label">A.I Chat</span>
      </button>

      <button class="choice" type="button" data-feature="medical">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 64 58" fill="none">
            <path d="M14 5 H42 L53 16 V51 H14 Z" fill="#fffaf0" stroke="#563014" stroke-width="4" stroke-linejoin="miter"/>
            <path d="M42 5 V16 H53" stroke="#563014" stroke-width="4"/>
            <rect x="27" y="14" width="6" height="18" fill="#ef6654"/><rect x="21" y="20" width="18" height="6" fill="#ef6654"/>
            <rect x="21" y="38" width="25" height="3" fill="#563014"/><rect x="21" y="44" width="20" height="3" fill="#563014"/>
          </svg>
        </span>
        <span class="choice-label">Professional<br>Medical Advice</span>
      </button>
    </section>

    <p class="footer-note">Little steps count. <span>✦</span> You matter.</p>
  </main>

  <dialog id="featureDialog" aria-labelledby="dialogTitle">
    <div class="modal-content">
      <h2 id="dialogTitle">Coming soon!</h2>
      <p id="dialogMessage">This part of Capycare is a demo placeholder.</p>
      <div class="modal-actions"><button class="close-button" id="closeDialog" type="button">Got it!</button></div>
      <div class="small-note">Prototype only: this page does not provide real chat, AI support, or medical care. Please don't enter private or sensitive information.</div>
    </div>
  </dialog>

  <script>
    const dialog = document.getElementById('featureDialog');
    const dialogTitle = document.getElementById('dialogTitle');
    const dialogMessage = document.getElementById('dialogMessage');
    const content = {
      anonymous: {
        title: 'Anonymous Chat',
        message: 'Peer chat is not connected yet. This is just a demo, in reality, this button will lead to anonymous chatrooms, aswell as private dms.'
      },
      ai: {
        title: 'A.I Chat',
        message: 'The AI helper is not connected yet. In a real version, it would give careful, source-based information and make it clear that it is just an A.I that cant give accurate medical advice. The main use of the A.I will be to ask it quesitons you may be too ashamed to ask others, and it will make it easier for users to find resources on the website.'
      },
      medical: {
        title: 'Professional Medical Advice',
        message: 'This demo cannot provide professional medical advice. A real version should link to trustworthy health information provided by qualified professionals, the names and other publishings of these medical professionals will also be provided, allowing people to find the help they need.'
      }
    };
    document.querySelectorAll('[data-feature]').forEach((button) => {
      button.addEventListener('click', () => {
        const feature = content[button.dataset.feature];
        dialogTitle.textContent = feature.title;
        dialogMessage.textContent = feature.message;
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else window.alert(feature.title + '\n\n' + feature.message);
      });
    });
    document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
